name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pakyinwww-github-io
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install and build
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          touch dist/.nojekyll

      - name: Check deployment credential
        id: deploy_access
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo '::notice::Build passed. Configure PAGES_DEPLOY_KEY to enable publishing.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out destination
        if: steps.deploy_access.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pakyinwww/pakyinwww.github.io
          ref: master
          path: .github-pages-deploy
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          persist-credentials: true

      - name: Pull latest destination
        if: steps.deploy_access.outputs.ready == 'true'
        working-directory: .github-pages-deploy
        run: git pull --ff-only origin master

      - name: Replace destination files with build
        if: steps.deploy_access.outputs.ready == 'true'
        run: |
          test -d .github-pages-deploy/.git
          rsync --archive --delete --exclude='.git/' dist/ .github-pages-deploy/

      - name: Commit and push
        if: steps.deploy_access.outputs.ready == 'true'
        working-directory: .github-pages-deploy
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'The published site is already up to date.'
            exit 0
          fi
          git commit -m "Deploy blog wrapper from ${SOURCE_SHA}"
          git push origin HEAD:master
